name: 🐦 PigeonPost CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: self-hosted
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install dependencies
      run: |
        python -m ensurepip --upgrade
        python -m pip install --upgrade pip
        python -m pip install fastapi==0.95.2 uvicorn==0.22.0 pydantic==1.10.13 pytest==7.4.3 httpx==0.24.1

    - name: Run Pytest
      run: |
        python -m pytest test_main.py -v --tb=short

    - name: Start application and verify
      run: |
        Write-Host 'Starting PigeonPost application...'
        Start-Process -FilePath 'python' -ArgumentList '-m', 'uvicorn', 'main:app', '--port', '8000'
        Start-Sleep -Seconds 5
        try {
            $response = Invoke-RestMethod -Uri 'http://localhost:8000/'
            Write-Host "Server response: $($response.message)"
            if ($response.message -like '*PigeonPost*') {
                Write-Host 'SUCCESS: Application is running and responding!'
            } else {
                Write-Host 'ERROR: Application response does not contain expected text'
                exit 1
            }
        } catch {
            Write-Host "ERROR: Failed to connect to application: $_"
            exit 1
        }
