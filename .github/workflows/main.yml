name: 🐦 PigeonPost CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    # ГЛАВНАЯ СТРОКА: используем наш self-hosted раннер!
    runs-on: self-hosted
    
    steps:
    - name: 📥 Checkout кода
      uses: actions/checkout@v4

#    - name: 🐍 Установка Python
#      uses: actions/setup-python@v5
#      with:
#        python-version: '3.11'

    - name:  Установка зависимостей
      run: |
        python -m pip install --upgrade pip
        pip install fastapi==0.95.2 uvicorn==0.22.0 pydantic==1.10.13 pytest==7.4.3 httpx==0.24.1

    - name: 🧪 Запуск тестов (Pytest)
      run: |
        python -m pytest test_main.py -v --tb=short
        echo "✅ Все тесты пройдены! Голубь Геннадий одобряет."

    - name: 🚀 Проверка запуска приложения
      run: |
        echo "🐦 Запускаем PigeonPost в фоне..."
        Start-Process python -ArgumentList "-m", "uvicorn", "main:app", "--port", "8000"
        Start-Sleep -Seconds 5
        $response = Invoke-RestMethod -Uri "http://localhost:8000/"
        Write-Host "Ответ сервера: $($response.message)"
        if ($response.message -match "PigeonPost") {
            Write-Host "✅ Приложение успешно запущено и отвечает!"
        } else {
            Write-Host "❌ Ошибка: приложение не отвечает"
            exit 1
        }
